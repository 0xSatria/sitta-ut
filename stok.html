<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Informasi Stok Bahan Ajar</title>
    <link rel="stylesheet" href="css/style.css">
    <!-- Tambahan style untuk gambar cover -->
    <style>
        .cover-img {
            width: 80px;
            height: auto;
            border: 1px solid #ddd;
            border-radius: 4px;
        }
    </style>
</head>
<body>
    <header>
        <h1>Stok Bahan Ajar</h1>
    </header>
    <main class="container">
        <table id="tabelStok">
            <thead>
                <tr>
                    <th>Kode Lokasi</th>
                    <th>Kode Barang</th>
                    <th>Nama Barang</th>
                    <th>Jenis</th>
                    <th>Edisi</th>
                    <th>Stok</th>
                    <th>Cover</th>
                </tr>
            </thead>
            <tbody id="isiTabel"></tbody>
        </table>
        <hr>
        <h3>Tambah Stok Baru</h3>
        <form id="formTambah">
            <input type="text" id="kodeLokasi" placeholder="Kode Lokasi" required>
            <input type="text" id="kodeBarang" placeholder="Kode Barang" required>
            <input type="text" id="namaBarang" placeholder="Nama Barang" required>
            <input type="text" id="jenisBarang" placeholder="Jenis Barang" required>
            <input type="number" id="edisi" placeholder="Edisi" required>
            <input type="number" id="stok" placeholder="Stok" required>
            <!-- Input cover opsional -->
            <input type="text" id="cover" placeholder="Nama file cover (contoh: img/buku.jpg)">
            <button type="submit" class="btn">Simpan</button>
        </form>
        <a href="dashboard.html" class="btn btn-secondary">Kembali ke Dashboard</a>
    </main>

    <script src="js/data.js"></script>
    <script>
        var isiTabel = document.getElementById('isiTabel');
        var formTambah = document.getElementById('formTambah');

        function renderTabel() {
            isiTabel.innerHTML = "";
            for (var i = 0; i < dataBahanAjar.length; i++) {
                var row = "<tr>";
                row += "<td>" + dataBahanAjar[i].kodeLokasi + "</td>";
                row += "<td>" + dataBahanAjar[i].kodeBarang + "</td>";
                row += "<td>" + dataBahanAjar[i].namaBarang + "</td>";
                row += "<td>" + dataBahanAjar[i].jenisBarang + "</td>";
                row += "<td>" + dataBahanAjar[i].edisi + "</td>";
                row += "<td>" + dataBahanAjar[i].stok + "</td>";
                // Kolom cover
                row += "<td><img src='" + dataBahanAjar[i].cover + "' alt='Cover' class='cover-img'></td>";
                row += "</tr>";
                isiTabel.innerHTML += row;
            }
        }
        renderTabel();

        formTambah.onsubmit = function(e) {
            e.preventDefault();
            var coverInput = document.getElementById('cover').value.trim();
            var baru = {
                kodeLokasi: document.getElementById('kodeLokasi').value.trim(),
                kodeBarang: document.getElementById('kodeBarang').value.trim(),
                namaBarang: document.getElementById('namaBarang').value.trim(),
                jenisBarang: document.getElementById('jenisBarang').value.trim(),
                edisi: document.getElementById('edisi').value.trim(),
                stok: parseInt(document.getElementById('stok').value.trim()),
                cover: coverInput !== "" ? coverInput : "img/default.jpg"  // jika dikosongi, pakai default
            };
            dataBahanAjar.push(baru);
            renderTabel();
            formTambah.reset();
            alert('Stok baru berhasil ditambahkan!');
        };
    </script>
</body>
</html>

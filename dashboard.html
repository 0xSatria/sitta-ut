<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard SITTA</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <h1>SITTA - Panel Utama</h1>
    </header>
    <main class="container">
        <div id="greeting"></div>
        <nav>
            <ul>
                <li><a href="stok.html" class="btn">Informasi Bahan Ajar</a></li>
                <li><a href="tracking.html" class="btn">Tracking Pengiriman</a></li>
                <li><a href="#" onclick="alert('Fitur Laporan belum tersedia')" class="btn">Laporan</a></li>
                <li><a href="#" onclick="alert('Fitur Histori belum tersedia')" class="btn">Histori Transaksi</a></li>
            </ul>
        </nav>
    </main>
    <footer>
        <small>&copy; 2025 Universitas Terbuka</small>
    </footer>

    <script src="js/data.js"></script>
    <script>
        // Greeting berdasarkan waktu
        var sekarang = new Date();
        var jam = sekarang.getHours();
        var sapaan = "Selamat ";
        if (jam < 12) {
            sapaan += "Pagi";
        } else if (jam < 15) {
            sapaan += "Siang";
        } else if (jam < 18) {
            sapaan += "Sore";
        } else {
            sapaan += "Malam";
        }
        var user = JSON.parse(sessionStorage.getItem('user'));
        var nama = user ? user.nama : "Pengguna";
        document.getElementById('greeting').textContent = sapaan + ", " + nama + "! Selamat datang di SITTA.";
    </script>
</body>
</html>
